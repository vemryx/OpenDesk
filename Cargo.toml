[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
opendesk-proto = { path = "crates/opendesk-proto" }
opendesk-codec = { path = "crates/opendesk-codec" }
opendesk-net = { path = "crates/opendesk-net" }
opendesk-platform = { path = "crates/opendesk-platform" }
opendesk-session = { path = "crates/opendesk-session" }
opendesk-relay = { path = "crates/opendesk-relay" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"
ring = "0.17"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
webpki-roots = "1"
rayon = "1"
zstd = "0.13"
jpeg-encoder = "0.7"
zune-jpeg = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6"
clap = { version = "4", features = ["derive", "env"] }
png = "0.17"

[profile.dev]
opt-level = 1

# O codec e a captura são inviáveis sem otimização, mesmo em desenvolvimento.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.opendesk-codec]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
